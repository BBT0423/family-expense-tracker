<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    .container { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 32px; }
    .otp-code { font-size: 36px; font-weight: bold; letter-spacing: 8px; color: #667eea; text-align: center; margin: 24px 0; }
    .footer { color: #999; font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>รหัส OTP เข้าสู่ระบบ</h2>
    <p>สวัสดี [Name],</p>
    <p>รหัส OTP สำหรับเข้าสู่ระบบด้วยเบอร์ <strong>[PhoneNumber]</strong>:</p>
    <div class="otp-code">[OtpCode]</div>
    <p>รหัสนี้จะหมดอายุใน <strong>5 นาที</strong></p>
    <p>หากคุณไม่ได้ทำรายการนี้ กรุณาเพิกเฉยต่ออีเมลนี้</p>
    <div class="footer">Family Expense Tracker</div>
  </div>
</body>
</html>
